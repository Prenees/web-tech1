<body>
    <script>
        // IF
        let a=10
        let b=20
        if(a+b>a){
            console.log("Heloooo")
        }
        if(a>b)
        {
            console.log("Hiiiii")
        }

        // If else

        if(a+b>100)
        {
            console.log("Dora")
        }

        {

        }

         if(a+b<100)

        {

        // Switch case

        let day=8
        let dayName;
        switch(day)
        {
            case 1:
                dayName="sunday"
                break;
            case 2:
                dayName="monday"
                break;
            case 3:
                dayName="Tuesday"
                break;
            case 4:
                dayName="Wednesday"
                break;
            case 5:
                dayName="Thursday"
                break;
            case 6:
                dayName="Friday"
                break;
            case 7:

                break;

        }
        console.log(dayName)
