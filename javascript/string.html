<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Single quotes
        let a='Heloo World..'
        console.log(a)

        // Double Quotes
        let b="Heloo Bhaiii"
        console.log(a)
        console.log("How are you"+b)

        // String literals   using (` Heloo`)

        let c="Doraa"
        console.log(`hello ${c}`)
        console.log(`Heloo "World.."`)


        // String methods

        let str="Dora is frd of bujii"
        console.log(str)

        // Length
        console.log("------------Length-----------------")
        console.log(str.length)

        // Concat
        console.log("------------Concat-----------------")
        console.log(str.concat(" as well as Map"))

        //Replace
        console.log("------------Replace-----------------")
        console.log(str)
        console.log(str.replace("Dora","Map"))

        // toUppercase
        console.log("------------ToUppercase-----------------")
        console.log(str)
        console.log(str.toUpperCase())

        // tolowercase
        console.log("------------Tolowercase-----------------")
        console.log(str)
        console.log(str.toLowerCase())

        // slice
        console.log("------------Slice-----------------")
        console.log(str)
        console.log(str.slice(0,4))
        // Indexof
        console.log("-------------Indexof----------------")
        console.log(str)
        console.log(str.indexOf("f"))

        // lastindexof
        console.log("-----------Lastindexof------------------")
        console.log(str)
        console.log(str.lastIndexOf("f"))

        // trimstart
        console.log("-------------Trimstart----------------")
        console.log(str)
        console.log(str.trimStart())

        // trimend
        console.log("------------Trimend-----------------")
        console.log(str)
        console.log(str.trimEnd())

        // Repeat
        console.log("------------Repeat-----------------")
        console.log(str)
        console.log(str.repeat(5))

        // includes
        console.log("----------Includes-------------------")
        console.log(str)
        console.log(str.includes("b"))
        console.log(str.includes("x"))

        // match--
        console.log("------------Match-----------------")
        console.log(str)
        console.log(str.match("b")) 
        console.log(str.match("x"))

        // charAt
        console.log("-----------CharAt------------------")
        console.log(str)
        console.log(str.charAt(5))

        // charcodeAt
        console.log("-----------CharCodeAt------------------")
        console.log(str)
        console.log(str.charCodeAt(5))

        // PadStart
        let x="Map"
        console.log(x)
        console.log(x.padStart(11,"Naanthan"))

        // PadEnd

        let y="Winter"
        console.log(y)
        console.log(y.padEnd(15,"Is Coming"))

    </script>
</body>
</html>
