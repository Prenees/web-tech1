<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Arithmetic
        let a=10
        let b=20
        console.log(a+b)
        console.log(a-b)
        console.log(a*b)
        console.log(a/b)
        console.log(a%b)

        // Comparion/Relational

        let x=10
        let y=20
        console.log(x>y)
        console.log(x<y)
        console.log(x>=y)
        console.log(x<=y)
        console.log(x==y)
        console.log(x!=y)

        // Logical 

        let p=300
        let q=200
        // AND
        console.log(p>q&&p<q)
        console.log(p<q&&p>q)
        console.log(p>q&&q<p)
        console.log(p<q&&p<q)

        // OR
        console.log(p>q||p<q)
        console.log(p<q||p>q)
        console.log(p>q||q<p)
        console.log(p<q||q>p)

        // NOT
        console.log(!(p>q)||(p<q))
        console.log((p>q)&&!(p<q))

        // Assignment

        let i=10
        let o=20
        console.log(i=i+o)
        console.log(i+=o)
        console.log(i=i*o)
        console.log(i*=o)

        // Ternary
        let m=300
        let n=200
        let big=m>n?m:n
        console.log(big)

        let small=m<n?m:n
        console.log(small)

    </script>
</body>
</html>
