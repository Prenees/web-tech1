<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // ARRAY 
        // Normal way...

        let arr1=[1,2,3,4]
        console.log(arr1)

        let arr2=[5,6,7,8]
        console.log(arr2)

        // Expand by new array

        let arr3=[1,2,3,4,5,6,7,8]
        console.log(arr3)


        //By using Spread Operator

        arr1=[1,2,3,4]
        arr2=[...arr1,5,6,7,8]
        console.log(arr2)
        let arr4=[...arr2,9,10]
        console.log(arr4)

        // Object

        // Normal way

        let obj1={
            Name:"Dora",
            age:23
        }
        console.log(obj1)


        let obj2={
            City:"Kochi",
            Country:"India"
        }
        console.log(obj2)

        // Expand by new Onject

        let obj3={
            Name:"Dora",
            age:23,
            City:"Kochi",
            Country:"India"
        }
        console.log(obj3)

        // BY using Spread Operator

        obj1={
            Name:"Dora",
            age:23
        }
        console.log(obj1)
         obj2={
            ...obj1,
            City:"Kochi",
            Country:"India"
         }
         console.log(obj2)

         let obj4={
            ...obj2,
            food:"Sambar",
            Drink:"OM"
         }
         console.log(obj4)
    </script>
</body>
</html>
