<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //  Primitive data types

        // String

        let a="Dora"
        console.log(a)
        console.log(typeof a)

        // NUmbers
        let b=10
        console.log(b)
        console.log(typeof b)

        // Boolean
        let c=true
        console.log(c)
        console.log(typeof c)

        // Bigint
        let d=40n
        console.log(d)
        console.log(typeof d)

        // Undefined
        let e=undefined
        console.log(e)
        console.log(typeof e)

        // Null
        let f=null
        console.log(f)
        console.log(typeof f)

        // Symbol
        let g=Symbol()
        console.log(g)
        console.log(typeof g)

        // Non primitive data type

        // Array
        let arr=[10,20,30,40,50]
        console.log(arr)
        console.log(typeof arr)

        // Object
        let obj={
            name:"Dora",
            age:15,
            city:"Forest"
        }
        console.log(obj)
        console.log(typeof obj)
    </script>
</body>
</html>
