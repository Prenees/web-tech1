<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // For loop
        for(i=10;i<=20;i++)
    {
        console.log(i)
    }

    for(j=10;j>=0;j--)
    {
        console.log(j)
    }

    // While
    let a=10
    while(a<=15)
    {
        console.log(a)
        a++
    }

    // Do-while
    let b=30
    do{
        console.log(b)
        b++
    }
    while(b<10)
    </script>
</body>
</html>
